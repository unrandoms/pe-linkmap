[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-linkmap"
version = "0.2.0"
description = "Inspect PE exports and compare DLL release surfaces without loading binaries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["dll", "pe", "exports", "compatibility", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jinja2>=3.0",
]

[project.optional-dependencies]
pefile = ["pefile>=2023.2.7"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Repository = "https://github.com/unrandoms/pe-linkmap"

[project.scripts]
pe-linkmap = "pe_linkmap.cli:main"
dll-proxy-gen = "dll_proxy_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dll_proxy_gen*", "pe_linkmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
