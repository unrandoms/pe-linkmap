[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dll-proxy-gen"
version = "0.1.0"
description = "DLL proxy generator: read exports from a target DLL and generate forwarding stub source"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["dll", "proxy", "pe", "windows", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.0",
]

[project.optional-dependencies]
pefile = ["pefile>=2023.2.7"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
dll-proxy-gen = "dll_proxy_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dll_proxy_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
